name: Tests, Code Quality, Build

on:
  push:
    tags:
      - "*"
  pull_request:
    branches:
      - main

jobs:

  test:
    name: Run unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Install dependencies
        run: uv sync --group dev
      - name: Run test suite
        run: uv run pytest

  code-quality:
    name: Code quality checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"
      - name: Install dependencies
        run: uv sync --group dev
      - name: Run pre-commit
        run: uv run prek run -v --show-diff-on-failure --all-files

  build_wheels:
    name: Build wheels for ${{ matrix.os }}
    runs-on: ${{ matrix.runs-on }}
    strategy:
      matrix:
        include:
          - os: linux-intel
            runs-on: ubuntu-latest
#          - os: windows-intel
#            runs-on: windows-latest
          - os: macos-arm
            runs-on: macos-latest
    needs: [ test, code-quality ]
    steps:
      - name: Check out repository code
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"
      - name: Build wheels
        uses: pypa/cibuildwheel@v4.2.1
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: cibw-wheels-${{ matrix.os }}-${{ strategy.job-index }}
          path: ./wheelhouse/*.whl

  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    needs: [ test, code-quality ]
    steps:
      - name: Check out repository code
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Build sdist
        run: uv tool run --from build pyproject-build --sdist
      - uses: actions/upload-artifact@v4
        with:
          name: cibw-sdist
          path: dist/*.tar.gz

  upload_pypi:
    needs: [ build_wheels, build_sdist ]
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://pypi.org/p/affidiff/
    permissions:
      id-token: write
      contents: read
#    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags')
    steps:
      - name: Unpack all CIBW artifacts into dist/
        uses: actions/download-artifact@v5
        with:
          pattern: cibw-*
          path: dist
          merge-multiple: true
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # To test uploads to TestPyPI, uncomment the following:
        with:
          repository-url: https://test.pypi.org/legacy/
